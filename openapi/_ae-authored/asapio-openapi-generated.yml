components:
  schemas:
    GetConnectionsetResponse:
      type: object
      properties:
        ConnectionId:
          type: string
          description: ASAPIO instance identifier; primary navigation anchor
        ConnectionType:
          type: string
          description: Connector type used by this connection
        RFCDest:
          type: string
          description: RFC destination name
        Hostname:
          type: string
          description: HTTP destinations only
        Port:
          type: string
          description: HTTP destinations only
        SSL:
          type: boolean
          description: HTTP destinations only
    GetConnectorsetResponse:
      type: object
      properties:
        ConnectorId:
          type: string
          description: Unique connector type identifier
        isInstalled:
          type: boolean
          description: Always true ; non-installed connectors are excluded from results
        isActive:
          type: boolean
          description: true if at least one connection uses this connector type
        HeaderAttributes:
          type: string
          description: Comma-separated NAME=VALUE pairs
        LoadType:
          type: string
          description: 'Outbound only: I (Incremental), P (Packed), F (Full load)'
        DataLayer:
          type: string
          description: 'Outbound only: ASAPIO Payload, Table/View, or Custom'
        ASAPIOPayload:
          type: string
          description: 'Outbound: payload view name'
        ASAPIOPayloadVersion:
          type: string
          description: 'Outbound: payload version'
        TableView:
          type: string
          description: 'Outbound: table or view name'
    GetInterfacesetResponse:
      type: object
      properties:
        InterfaceId:
          type: string
          description: Interface identifier
        ConnectionId:
          type: string
          description: Parent connection; primary filter key
        Direction:
          type: string
          description: Inbound or Outbound
        MessageType:
          type: string
          description: SAP message or event type
        lastRun:
          type: string
          description: Timestamp of last execution
        isActive:
          type: boolean
          description: Activation status (see determination logic above)
        Events:
          type: string
          description: Comma-separated linked events; always populated regardless of isActive
        HeaderAttributes:
          type: string
          description: Comma-separated NAME=VALUE pairs; always populated
        LoadType:
          type: string
          description: 'Outbound only: I , P , or F'
        DataLayer:
          type: string
          description: 'Outbound only: ASAPIO Payload, Table/View, or Custom'
        ASAPIOPayload:
          type: string
          description: 'Outbound: payload view name'
        ASAPIOPayloadVersion:
          type: string
          description: 'Outbound: payload version'
        TableView:
          type: string
          description: 'Outbound: table or view name'
